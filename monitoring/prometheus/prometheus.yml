global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: aws-ec2
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: docker
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: safemedi-dev
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - safemedi-dev:8080
        labels:
          environment: dev

  - job_name: safemedi-prod
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - safemedi-prod:8080
        labels:
          environment: prod

  - job_name: gcp-mysql
    scrape_interval: 60s
    static_configs:
      - targets:
          - mysqld-exporter:9104
        labels:
          environment: prod
