spring:
  application:
    name: safemedi

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  profiles:
    include: ${SPRING_PROFILES_INCLUDE:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
jwt:
  secret: ${JWT_SECRET}

app:
  # 이미지 입력·구조화 출력을 지원하는 AI 모델 ID와 API 키를 배포 환경에서 설정한다.
  prescription-extraction:
    api-key: ${API_KEY}
    model: ${AI_MODEL}
    timeout-seconds: 30
  test-login:
    enabled: false
  family-invitation:
    base-url: ${FAMILY_INVITATION_BASE_URL}
    token-encryption-key: ${FAMILY_INVITATION_TOKEN_ENCRYPTION_KEY}

kakao:
  local-api:
    rest-api-key: ${KAKAO_REST_API_KEY}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  outbox:
    batch-size: ${FCM_OUTBOX_BATCH_SIZE:50}
    fixed-delay-ms: ${FCM_OUTBOX_FIXED_DELAY_MS:60000}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
